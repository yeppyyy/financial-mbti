function dataTable(rows){return `<table class="table"><thead><tr><th>정보</th><th>A</th><th>B</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.map(esc)[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`}function revealed(i){return state.opened[i].map(j=>`<div class="revealed"><b>${esc(products[i].extra[j][0])}</b>${dataTable([products[i].extra[j]])}${i===2&&products[i].extra[j][0]==='PER'?'<p class="hint">PER(주가수익비율)은 주가 ÷ 주당순이익(EPS)입니다. 예를 들어 12배는 주가가 주당순이익의 12배라는 뜻입니다. 높고 낮음만으로 투자 가치를 판단할 수는 없습니다.</p>':''}</div>`).join('')}// 추가정보 열람 전 시각 탐색 과제를 수행합니다.

function makeEffort(i){
  const stage=Math.min(4,state.opened[i].length);

  if(stage===0){
    question='다음 중 다른 모양 하나를 선택해 주세요.';

    options=[effortItem('triangle','blue'),effortItem('triangle','red'),effortItem('triangle','yellow'),effortItem('circle','blue'),effortItem('square','blue'),effortItem('circle','red')];

    // 정답 쌍은 반드시 하나만 나오도록 정답 두 개 이외에 빨간 원을 넣지 않습니다.
    const decoys=[effortItem('square','yellow'),effortItem('circle','blue'),effortItem('triangle','red'),effortItem('square','green'),effortItem('circle','yellow'),effortItem('triangle','blue')];
    const pos=1+effortRand(5);
    options=effortShuffle(decoys);options.splice(pos,0,effortItem('circle','red'),effortItem('square','yellow'));
    answer=pos+1;
  }else{
    question='파란색 삼각형 중, 바로 앞에 빨간색 원이 있는 도형을 선택해 주세요.';
    // 유일한 빨간 원 다음에 정답 파란 삼각형을 두어 정답이 하나로 결정됩니다.
    const decoys=[effortItem('triangle','blue'),effortItem('circle','green'),effortItem('triangle','yellow'),effortItem('square','blue'),effortItem('triangle','blue'),effortItem('square','red'),effortItem('circle','yellow'),effortItem('triangle','red')];
    const pos=1+effortRand(7);
    options=effortShuffle(decoys);options.splice(pos,0,effortItem('circle','red'),effortItem('triangle','blue'));

}

function setSocial(i,v){state.social[i]=Number(v);document.getElementById('sv'+i).textContent=money(Number(v));document.getElementById('sm'+i).textContent='포기 후 내 보상: '+money(social[i].me-Number(v));const zero=document.getElementById('socialZero'+i);if(zero)zero.classList.toggle('chosen',Number(v)===0);const range=document.querySelectorAll('.question.tile input.range')[i];if(range)range.value=String(v)}
let autoWeightIndex=null;

  if(previous==='' && v!=='' && !weightOverBudgetEditing && blanks.length===1 && remaining>=0 && state.weights.every(x=>x===''||(Number.isInteger(Number(x))&&Number(x)>=0&&Number(x)<=100))){

// Four independent diagonal handles: no 4D-to-2D projection or paired-axis coupling.

    const r=sq.getBoundingClientRect();
    const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    const [cx,cy]=axisCorners[i];
    // Projection onto only the selected corner's center-to-corner ray.
    const t=Math.max(0,Math.min(1,((x-.5)*(cx-.5)+(y-.5)*(cy-.5))/.5));
    setAxisWeight(i,t*100);
  }
  sq.querySelectorAll('.axisDot').forEach(dot=>{
    const i=Number(dot.dataset.axis);
    dot.addEventListener('pointerdown',e=>{e.preventDefault();active=i;dot.setPointerCapture(e.pointerId);move(e,i)});
    dot.addEventListener('pointermove',e=>{if(active===i)move(e,i)});
    dot.addEventListener('pointerup',()=>{active=null});
    dot.addEventListener('pointercancel',()=>{active=null});
    dot.addEventListener('keydown',e=>{
      if(!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key))return;
      e.preventDefault();
      setAxisWeight(i,(Number(state.weights[i])||0)+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1));
    });
  });
  updateSquareDot();
}

function recommend(scores){
  const riskLevel=scores[0]<.25?0:scores[0]<.5?1:scores[0]<.75?2:3;
  const urgency=1-scores[1];
  const candidates=recommendationTypes.filter(p=>p.min<=riskLevel && !(p.id==='govdirect'&&urgency>.55));
  const ranked=candidates.map(p=>{
    const riskFit=p.min===riskLevel?1:0;
    const timeFit=urgency*p.liquid+(1-urgency)*(3-p.liquid);
    const baseline=p.min===0?.4:0;
    const rank=1.5*riskFit+1.5*timeFit+baseline;
    return {...p,rank,riskFit,timeFit,baseline};
  }).sort((a,b)=>b.rank-a.rank||a.min-b.min||a.name.localeCompare(b.name,'ko'));
  return {riskLevel,urgency,items:ranked.slice(0,3),ranked};
}

function profileVisual(scores){
 const v=scores.map(x=>Math.max(0,Math.min(100,Math.round((Number.isFinite(x)?x:0)*100))));
 const pairs=[['위험회피','위험수용'],['현재중심','미래중심'],['자기이익 중심','타인 고려'],['신속결정','정보탐색']];
 const bars=pairs.map(([left,right],i)=>{
   const x=v[i], delta=x-50, width=Math.abs(delta)*3.2;
   const rect=delta<0?`<rect x="${160-width}" y="8" width="${width}" height="14" rx="3" fill="#3183ca"/>`:`<rect x="160" y="8" width="${width}" height="14" rx="3" fill="#e89048"/>`;
   return `<div class="directionRow"><div class="directionLabels"><span>${left}</span><span>${right}</span></div><svg viewBox="0 0 320 30" width="100%" role="img" aria-label="${left}에서 ${right}까지 ${x}점"><rect x="0" y="8" width="320" height="14" rx="4" fill="#e9edf5"/><line x1="160" y1="3" x2="160" y2="27" stroke="#7c8ba4" stroke-width="1.5"/>${rect}<circle cx="${x*3.2}" cy="15" r="5" fill="#fff" stroke="#334155" stroke-width="1.7"/></svg><div class="directionScore">${x}점 · ${x<50?left:x>50?right:'분류 경계'}</div></div>`;
 }).join('');
 const profile=typeInfo(scores);
 return `<div class="profileHero"><div class="profileAvatar" role="img" aria-label="${esc(profile.animal)} 캐릭터">${profile.avatar}</div><div><div class="pill">나의 금융 탐험 파트너 · ${esc(profile.animal)}</div><p class="sub" style="margin:8px 0 0">${esc(profile.summary)}</p></div></div><div class="directionChart"><h3>나의 금융 의사결정 성향</h3>${bars}<div class="directionLegend"><span><i style="background:#3183ca"></i>왼쪽 성향</span><span><i style="background:#e89048"></i>오른쪽 성향</span></div><p class="profileFunNote">중앙의 50점은 통계적 평균이나 이상적인 점수가 아닌 연구용 유형 분류 기준입니다. 어느 방향도 더 우수한 성향을 뜻하지 않습니다.</p></div>`;
}

// Draw a shareable, fixed-size report directly into a canvas. No external capture library or server upload.
async function downloadProfilePNG(){
  if(state.page!==7)return;
  const scores=scoring(),info=typeInfo(scores), rec=recommend(scores).items;
  const W=1080,H=1350;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  if(!ctx){alert('이 브라우저에서는 이미지 생성이 지원되지 않습니다.');return;}
  const C={paper:'#ffffff',ink:'#23362f',muted:'#64736b',line:'#dfe5dd',faint:'#f4f6f2',deep:'#375747',left:'#658e95',right:'#c39376'};
  const FONT='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
  function font(size,weight=400){ctx.font=`${weight} ${size}px ${FONT}`;}
  function text(t,x,y,size=23,color=C.ink,weight=400){font(size,weight);ctx.fillStyle=color;ctx.textBaseline='alphabetic';ctx.fillText(String(t),x,y);}
  function line(x1,y1,x2,y2,color=C.line,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
  function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
  function wrap(t,maxWidth,size,weight=400,maxLines=99){
    font(size,weight);const words=String(t).split('');let lines=[],current='';
    for(const c of words){if(ctx.measureText(current+c).width>maxWidth&&current){lines.push(current);current=c;}else current+=c;}
    if(current)lines.push(current);
    if(lines.length>maxLines){lines=lines.slice(0,maxLines);let tail=lines[maxLines-1];while(tail&&ctx.measureText(tail+'…').width>maxWidth)tail=tail.slice(0,-1);lines[maxLines-1]=tail+'…';}
    return lines;
  }
  function paragraph(t,x,y,maxWidth,size=22,leading=35,color=C.ink,maxLines=3,weight=400){
    const lines=wrap(t,maxWidth,size,weight,maxLines);lines.forEach((part,i)=>text(part,x,y+i*leading,size,color,weight));return lines.length;
  }
  rect(0,0,W,H,C.paper);
  // Brand and report metadata
  text('FINANCIAL MBTI',76,85,23,C.deep,700);
  ctx.textAlign='right';text('PERSONAL REPORT',1004,85,18,C.muted,500);ctx.textAlign='left';
  line(76,109,1004,109);
  text('나의 금융 의사결정 유형',76,169,23,C.muted,500);
  round(76,205,114,114,20,C.faint);
  ctx.textAlign='center';text(info.avatar||'◈',133,286,64,C.ink,500);ctx.textAlign='left';
  const titleLines=wrap(info.title,740,46,750,2);
  titleLines.forEach((t,i)=>text(t,216,251+i*53,46,C.ink,750));
  text(info.code,218,314+(titleLines.length-1)*49,31,C.deep,700);
  paragraph(info.summary,76,373,920,24,38,C.muted,2);
  line(76,431,1004,431);
  text('01  FOUR DIMENSIONS',76,480,22,C.deep,700);
  const pairs=[['위험회피','위험수용'],['현재중심','미래중심'],['자기이익 중심','타인 고려'],['신속결정','정보탐색']];
  const v=scores.map(x=>Math.max(0,Math.min(100,Math.round(Number(x)*100))));
  for(let i=0;i<4;i++){
    const y=540+i*91,[l,r]=pairs[i];
    text(l,76,y,22,C.ink,600);ctx.textAlign='right';text(r,1004,y,22,C.ink,600);ctx.textAlign='left';
    const bx=76, by=y+21, bw=928,bh=12,mid=bx+bw/2,endpoint=bx+bw*v[i]/100;
    round(bx,by,bw,bh,6,'#e9eeeb');
    if(v[i]<50)round(endpoint,by,mid-endpoint,bh,5,C.left);
    else round(mid,by,endpoint-mid,bh,5,C.right);
    line(mid,by-7,mid,by+bh+7,'#889b91',2);
    ctx.beginPath();ctx.arc(endpoint,by+bh/2,7,0,2*Math.PI);ctx.fillStyle='#ffffff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.deep;ctx.stroke();
  }
  text('중앙 50점은 유형 분류의 경계이며, 어느 방향도 더 우수한 성향을 뜻하지 않습니다.',76,914,18,C.muted);
  line(76,946,1004,946);
  text('02  DECISION NOTES',76,993,22,C.deep,700);
  const high=scores.map(x=>x>=.5);
  const strength=high[1]?'미래의 보상을 고려하며 선택하는 경향이 있습니다.':'현재의 보상과 자금 이용 가능성을 중시하는 경향이 있습니다.';
  const check=high[3]?'정보를 확인할 때 필요한 시간과 노력도 함께 고려해 보세요.':'상품을 선택하기 전 비용·손실 가능성·해지 조건을 확인해 보세요.';
  round(76,1022,450,110,12,C.faint);round(546,1022,458,110,12,C.faint);
  text('나의 특징',96,1053,19,C.deep,700);
  paragraph(strength,96,1084,408,20,30,C.ink,2);
  text('확인할 점',566,1053,19,C.deep,700);
  paragraph(check,566,1084,410,20,30,C.ink,2);
  line(76,1161,1004,1161);
  text('03  PRODUCT SHORTLIST',76,1203,22,C.deep,700);
  const recText=rec.map((p,i)=>`${String(i+1).padStart(2,'0')}  ${p.name}`).join('   /   ');
  // A long Korean product name must not shrink the entire document: wrap at two lines.
  paragraph(recText,76,1243,925,21,32,C.ink,2,600);
  text('성향에 따른 탐색 후보이며, 개인별 투자 적합성을 확정하는 추천이 아닙니다.',76,1322,16,C.muted);
  const fileName=`financial-mbti-report-${info.code}.png`;
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob){alert('이미지를 생성하지 못했습니다. 다시 시도해 주세요.');return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

 html=`<div class="gameScreen"><h2>🏁 12개월 생활 기록</h2><div class="gameHud"><div class="gameStat"><small>최종 총자산</small><strong>${lifeAmount(lifeTotal())}</strong></div><div class="gameStat"><small>현금</small><strong>${lifeAmount(life.cash)}</strong></div><div class="gameStat"><small>생활비 지급 총액</small><strong>12,000,000원</strong></div></div>${lifePatternHTML()}<h3>나의 12개월 기록</h3><div class="gameTimeline">${histories.map(h=>`<div class="gameMonth"><div class="stamp">STAGE ${String(h.month).padStart(2,'0')} · ${h.month}/${h.day}</div><div class="sprite">${h.icon}</div><b>${esc(h.title)}</b><p>${esc(h.choice)}</p><p>후속 상황 ${h.arrived.length}건 · 확인 정보 ${h.infoOpened}개</p><p class="amount">총자산 ${lifeAmount(h.closing.total)}</p></div>`).join('')}</div>${pending.length?`<p class="gameMessage">연말 이후의 후속 사건 ${pending.length}건은 이번 결산에는 포함되지 않았습니다.</p>`:''}<div class="actions"><button class="gameBtn" onclick="startLifeGame()">처음부터 다시 시작</button><button class="gameBtn secondary" onclick="result()">검사 결과로 돌아가기</button></div></div>`;
 }else if(life.phase==='choice'){
 const ev=life.events[life.month];
 html=`<div class="gameScreen"><div class="gameEventMeta">◆ LEVEL ${String(life.month+1).padStart(2,'0')} / 12 · ${life.month+1}월 ${ev.day}일</div><h2>한 달 100만 원으로 살아남기</h2><div class="gameHud"><div class="gameStat"><small>이번 달 생활비 포함 현금</small><strong>${lifeAmount(life.cash+1000000)}</strong></div><div class="gameStat"><small>예금</small><strong>${lifeAmount(life.deposit)}</strong></div><div class="gameStat"><small>주식·펀드</small><strong>${lifeAmount(life.stock+life.fund)}</strong></div></div><div class="gameScene" aria-hidden="true">${ev.icon}</div><h3>${esc(ev.title)}</h3><p class="gameIntro">${esc(ev.story)}</p>${ev.axis==='I'?`<div class="gameMessage"><b>더 알아보기</b><div class="gameInfoList">${ev.info.map((txt,i)=>`<button class="gameInfoBtn" onclick="lifeRevealInfo(${i})" ${ev.opened.includes(i)?'disabled':''}>${ev.opened.includes(i)?'✓ 확인 완료':'🔎 조건 '+(i+1)+' 확인'}</button>${ev.opened.includes(i)?`<p>${esc(txt)}</p>`:''}`).join('')}</div></div>`:''}${ev.choices.map((opt,i)=>`<button class="gameChoice" onclick="lifeChoose(${i})">${'ABCD'[i]} · ${esc(opt[0])}</button>`).join('')}<div class="actions"><button class="gameBtn secondary" onclick="result()">검사 결과로 돌아가기</button></div></div>`;
 }else{
 const h=life.history.at(-1);
 html=`<div class="gameScreen"><div class="gameEventMeta">◆ ${h.month}월 ${h.day}일 · 월별 정산</div><h2>${h.icon} ${esc(h.title)}</h2><div class="gameMessage">${esc(h.choice)}</div>${h.arrived.length?`<div class="gameMessage"><b>지난 선택의 후속 이야기</b>${h.arrived.map(f=>`<p>${esc(f.text)} ${f.delta?lifeMoney(f.delta):''}</p>`).join('')}</div>`:''}<h3>📒 ${h.month}월 가계부</h3><div class="gameLedger"><div><span>월초 총자산</span><b>${lifeAmount(h.opening.total)}</b></div><div class="gain"><span>이번 달 생활비</span><b>+${lifeAmount(h.salary)}</b></div><div class="loss"><span>기본 생활 지출</span><b>-${lifeAmount(h.baseExpense)}</b></div><div class="${h.eventCost>=0?'gain':'loss'}"><span>이번 사건의 지출·보상</span><b>${lifeMoney(h.eventCost)}</b></div>${h.arrived.length?`<div><span>이전 선택의 후속 정산</span><b>${lifeMoney(h.arrivedAmount)}</b></div>`:''}<div><span>예금 이자</span><b>${lifeMoney(h.depositInterest)}</b></div><div><span>주식 수익·손실</span><b>${lifeMoney(h.stockPnL)}</b></div><div><span>펀드 수익·손실</span><b>${lifeMoney(h.fundPnL)}</b></div><hr><div><span>현금</span><b>${lifeAmount(life.cash)}</b></div><div><span>예금</span><b>${lifeAmount(life.deposit)}</b></div><div><span>주식 / 펀드</span><b>${lifeAmount(life.stock)} / ${lifeAmount(life.fund)}</b></div><div><strong>월말 총자산</strong><strong>${lifeAmount(lifeTotal())}</strong></div></div><h3>💼 자산 관리 (선택)</h3><p class="sub">현금 5만 원을 예금·주식·펀드로 옮기거나 현금화할 수 있습니다.</p><div class="lifeAssetButtons">${[['deposit','예금'],['stock','주식'],['fund','펀드']].map(([k,n])=>`<button class="gameChoice" onclick="lifeChangeAsset('${k}')">현금 → ${n} 5만 원</button><button class="gameChoice" onclick="lifeChangeAsset('${k}',true)">${n} → 현금 5만 원</button>`).join('')}</div><div class="actions"><button class="gameBtn" onclick="lifeNext()">${h.month===12?'12개월 결산 보기':'다음 달 →'}</button></div></div>`;
 }
 shell('LIFE SIMULATION','금융생활 시뮬레이터',html,false);
}

render();
</script></body></html>
